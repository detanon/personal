<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- SLOT: page-title -->
  <title><!-- PROJECT NAME --> — Dave Frazee</title>
  <style>
    /* ============================================================
       SHARED STYLES — do not modify these
       These match index.html exactly
    ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0f12;
      --surface: #13161a;
      --border: #1e2227;
      --text-primary: #e8edf2;
      --text-secondary: #8a9099;
      --text-tertiary: #4a5058;
      --accent: #c8a96e;
      --accent-dim: rgba(200,169,110,0.15);
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'Space Grotesk', sans-serif;
    }

    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text-primary); font-family: var(--sans); }

    /* NAV */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 40px;
      background: rgba(13,15,18,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .nav-logo { font-family: var(--sans); font-size: 14px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-primary); text-decoration: none; }
    .nav-logo span { color: var(--accent); }
    .nav-back { font-family: var(--mono); font-size: 11px; color: var(--text-secondary); text-decoration: none; letter-spacing: 0.08em; }
    .nav-back:hover { color: var(--accent); }

    /* HERO */
    .case-hero {
      margin-top: 60px;
      height: 70vh;
      min-height: 480px;
      position: relative;
      overflow: hidden;
      background: var(--surface);
    }
    .case-hero img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0.75;
    }
    .case-hero-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(13,15,18,0.9) 0%, rgba(13,15,18,0.2) 60%, transparent 100%);
    }
    .case-hero-content {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 48px 40px;
      max-width: 900px;
    }
    .case-eyebrow {
      font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--accent); margin-bottom: 16px;
    }
    .case-title {
      font-family: var(--sans); font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 700; line-height: 1.05; letter-spacing: -0.02em;
      color: var(--text-primary); margin-bottom: 20px;
    }

    /* META CHIPS */
    .meta-chips {
      display: flex; flex-wrap: wrap; gap: 12px;
      padding: 28px 40px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .meta-chip {
      display: flex; flex-direction: column; gap: 3px;
      padding: 10px 16px;
      background: var(--bg);
      border: 1px solid var(--border);
    }
    .chip-label {
      font-family: var(--mono); font-size: 9px;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--text-tertiary);
    }
    .chip-value {
      font-family: var(--sans); font-size: 13px;
      font-weight: 500; color: var(--text-primary);
    }

    /* CONTENT */
    .case-content { max-width: 840px; margin: 0 auto; padding: 80px 40px; }

    .case-section { margin-bottom: 80px; }

    .section-label {
      font-family: var(--mono); font-size: 10px;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 24px;
      display: flex; align-items: center; gap: 12px;
    }
    .section-label::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }

    .case-body {
      font-size: 17px; line-height: 1.75;
      color: var(--text-secondary); max-width: 680px;
    }
    .case-body p + p { margin-top: 1em; }

    /* STATS */
    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1px; background: var(--border);
      margin: 40px 0; border: 1px solid var(--border);
    }
    .stat-block {
      background: var(--surface); padding: 28px 24px;
    }
    .stat-number {
      font-family: var(--sans); font-size: clamp(1.6rem, 3vw, 2.4rem);
      font-weight: 700; letter-spacing: -0.03em;
      color: var(--text-primary); margin-bottom: 6px;
    }
    .stat-label {
      font-family: var(--mono); font-size: 10px;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--text-tertiary);
    }

    /* CONCEPT → BUILT */
    .concept-built {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 2px; background: var(--border);
      margin: 40px 0;
    }
    .concept-panel { position: relative; overflow: hidden; background: var(--surface); }
    .concept-panel img { width: 100%; height: 360px; object-fit: cover; display: block; opacity: 0.85; }
    .concept-panel-label {
      position: absolute; top: 16px; left: 16px;
      font-family: var(--mono); font-size: 9px;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--accent); background: rgba(13,15,18,0.85);
      padding: 4px 10px;
    }
    .concept-caption {
      padding: 14px 16px;
      font-family: var(--mono); font-size: 10px;
      color: var(--text-tertiary); line-height: 1.5;
      border-top: 1px solid var(--border);
    }

    /* GALLERY */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 2px; background: var(--border);
      margin: 40px 0;
    }
    .gallery-grid.three-up { grid-template-columns: repeat(3, 1fr); }
    .gallery-item { position: relative; overflow: hidden; background: var(--surface); }
    .gallery-item.span-2 { grid-column: span 2; }
    .gallery-item img { width: 100%; height: 280px; object-fit: cover; display: block; opacity: 0.85; transition: opacity 0.3s; }
    .gallery-item img:hover { opacity: 1; }
    .gallery-caption {
      padding: 10px 12px;
      font-family: var(--mono); font-size: 10px;
      color: var(--text-tertiary); line-height: 1.4;
    }

    /* THE WORK */
    .work-list { list-style: none; margin-top: 8px; }
    .work-list li {
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
      font-size: 15px; color: var(--text-secondary);
      display: flex; align-items: baseline; gap: 12px;
    }
    .work-list li::before {
      content: '—'; color: var(--accent);
      font-family: var(--mono); font-size: 12px; flex-shrink: 0;
    }

    /* PARTNERS */
    .partners-strip {
      border-top: 1px solid var(--border);
      padding: 40px;
      background: var(--surface);
    }
    .partners-label {
      font-family: var(--mono); font-size: 10px;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--text-tertiary); margin-bottom: 24px;
    }
    .partners-list {
      display: flex; flex-wrap: wrap; gap: 16px; align-items: center;
    }
    .partner-name {
      font-family: var(--sans); font-size: 13px;
      color: var(--text-secondary); font-weight: 500;
      padding: 6px 14px; border: 1px solid var(--border);
    }

    /* FOOTER NAV */
    .case-footer {
      border-top: 1px solid var(--border);
      padding: 32px 40px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .footer-back {
      font-family: var(--mono); font-size: 11px;
      color: var(--text-secondary); text-decoration: none;
      letter-spacing: 0.08em;
    }
    .footer-back:hover { color: var(--accent); }
    .footer-sig {
      font-family: var(--mono); font-size: 10px;
      color: var(--text-tertiary); letter-spacing: 0.08em;
    }

    /* PHOTO CREDIT */
    .photo-credit {
      font-family: var(--mono); font-size: 9px;
      color: var(--text-tertiary); letter-spacing: 0.08em;
      padding: 8px 40px; text-align: right;
    }

    @media (max-width: 700px) {
      nav { padding: 16px 20px; }
      .case-hero-content { padding: 32px 20px; }
      .meta-chips { padding: 20px; }
      .case-content { padding: 48px 20px; }
      .concept-built { grid-template-columns: 1fr; }
      .gallery-grid { grid-template-columns: 1fr; }
      .gallery-item.span-2 { grid-column: span 1; }
      .case-footer { padding: 24px 20px; flex-direction: column; gap: 12px; }
      .partners-strip { padding: 32px 20px; }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
